artifacts = ["/app/interlock.st"]

[task]
name = "afterquery/wetwell-interlock-fix"
description = "Diagnose and fix behavioral defects in a PLC-style wet-well duplex pump interlock so it conforms to a written functional spec, without breaking a flood/lockout priority exception."
authors = [{ name = "Yvonne Awuor Ndolo", email = "ndolopj37@gmail.com" }]
keywords = ["plc", "scada", "interlock-logic", "structured-text", "instrumentation-and-control", "fail-safe-design"]

[metadata]
author_name = "Yvonne Awuor Ndolo"
author_email = "ndolopj37@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://www.linkedin.com/in/yvonne-awuor-7aa7b7395/"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "electrical-engineering"
subfield = "instrumentation & control interlock logic"
category = "Science"
subcategory = "Electrical & Computer Engineering"
tags = ["plc", "scada", "interlock-logic", "structured-text", "instrumentation-and-control", "fail-safe-design"]
expert_time_estimate_hours = 4
relevant_experience = """
Technical Services Attache, Network Management Division, Kenya Power & Lighting Company (KPLC), Nakuru, Kenya, Sep 2018 - Nov 2018.
Trained within the Network Management Division, supporting maintenance and repair of power transformers, circuit breakers and automatic recloser circuits.
Participated in condition monitoring and electrical testing, including insulation and oil testing, to support reliability of network equipment.
Gained exposure to system control using SCADA, protective-system diagnosis and testing, DC-system installation and maintenance, and electrical installations.
Assisted with field troubleshooting, equipment replacement and maintenance documentation in a regulated utility environment.
"""
difficulty_explanation = "The flood-must-interrupt-lockout priority rule is easy to satisfy for the two obvious bugs individually but easy to silently break while fixing them, because a plausible, clean restructuring of the output gate reorders the lockout check ahead of the flood check. The scenario, spec, and data here are synthetic (authored by myself), not drawn from a real incident."
solution_explanation = "High-level: fix 1 changes the lockout clear condition from 'trip went false' to 'timer reached zero'; fix 2 changes fault handling from 'hold last good value' to 'treat as low-low + raise sensor_fault_alarm'; both fixes must be made without disturbing the existing flood-overrides-lockout branch ordering in the output gate."
verification_explanation = "Ground truth is precomputed by running the reference-correct interlock.st through the same sealed ST interpreter used to grade the agent, over a held-out battery of tick sequences (not shown to the agent) that specifically probe lockout dwell time, sensor-fault fail-safe behavior, and flood interrupting an active lockout. A tick-by-tick exact match across every held-out sequence is required for reward 1; see authoring/build_sequences.py for the generation and self-check methodology, including an adversarial 'naive fix' fixture proving the flood-priority sequences catch a plausible incomplete fix."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

